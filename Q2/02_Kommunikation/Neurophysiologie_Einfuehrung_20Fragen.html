<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einführung in die Neurophysiologie – Wissenscheck</title>
<style>
  :root{--blue:#1f4e79;--bg:#f4f6f9;--ok:#2e7d32;--bad:#c62828;--line:#d5dbe3}
  *{box-sizing:border-box}
  body{font-family:Verdana,Geneva,sans-serif;background:var(--bg);color:#222;margin:0;padding:16px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:1.4rem;color:var(--blue);margin:0 0 4px}
  .sub{color:#555;font-size:.9rem;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .topic{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:bold}
  .q{font-weight:bold;margin:4px 0 4px}
  .hint{font-size:.8rem;color:#666;margin-bottom:8px}
  .hint b{color:var(--blue)}
  label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
  label.opt:hover{background:#eef3f9}
  label.opt input{margin-top:4px}
  .opt.ok{background:#e8f5e9;border-color:var(--ok)}
  .opt.bad{background:#fdecea;border-color:var(--bad)}
  .opt.miss{border:2px dashed var(--ok)}
  .exp{display:none;margin-top:8px;font-size:.88rem;background:#f7f9fc;border-left:4px solid var(--blue);padding:8px 10px}
  .show .exp{display:block}
  .verdict{display:none;font-weight:bold;font-size:.88rem;margin-top:6px}
  .show .verdict{display:block}
  button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  input[type=text]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:180px}
  .bar{height:12px;background:#e3e8ee;border-radius:6px;overflow:hidden;margin:4px 0 10px}
  .bar>div{height:100%;background:var(--blue)}
  .prog{position:sticky;top:0;background:var(--bg);padding:6px 0;font-size:.85rem;color:#555;z-index:2}
  #result{display:none}
  .small{font-size:.8rem;color:#666}
</style>
</head>
<body>
<div class="wrap">
  <h1>Einführung in die Neurophysiologie</h1>
  <div class="sub">Wissenscheck · Aufbau eines Neurons und Ionenverteilung · 20 Fragen<br>
    Bei jeder Frage steht dabei, ob <b>eine</b> oder <b>mehrere</b> Antworten richtig sind. Bei Mehrfachauswahl gibt es den Punkt nur, wenn du genau die richtigen Antworten ankreuzt.</div>

  <div class="card">
    <label>Klasse/Kurs (kein Name nötig, die Auswertung ist anonym): <input type="text" id="klasse" placeholder="z. B. Bio-LK 12"></label>
  </div>

  <div class="prog" id="prog">0 von 20 beantwortet</div>
  <div id="quiz"></div>
  <button id="check" disabled>Test auswerten</button>

  <div id="result" class="card" style="margin-top:16px"></div>
</div>

<script>
// ===== Konfiguration =====
const TEST_NAME = "Neurophysiologie_Einfuehrung_20Fragen";
const SHEET_URL = "https://script.google.com/macros/s/AKfycby8x0FGzAFkhU52oOclOp5bjJ9KcYyT_Od0Br0Pj_U531KB6T2MMRBaoazxCbroERGD/exec";

// o: [Text, richtig?]   multi: true = mehrere Antworten richtig
const Q = [
 {t:"Aufbau des Neurons", multi:false, q:"Welcher Teil des Neurons nimmt Erregungen von anderen Zellen auf?",
  o:[["Die Dendriten am Zellkörper",1],["Das Axon mit seinen Verzweigungen",0],["Die Endknöpfchen am Axonende",0],["Die Myelinscheide um das Axon",0]],
  e:"Dendriten sind verzweigte Fortsätze des Zellkörpers. Hier liegen die Synapsen, über die Signale anderer Neuronen eintreffen."},
 {t:"Aufbau des Neurons", multi:true, q:"Welche Aussagen zum Axonhügel treffen zu?",
  o:[["Hier werden die ankommenden Potentiale aufsummiert.",1],["Hier entscheidet sich, ob ein Aktionspotential entsteht.",1],["Hier werden Neurotransmitter in den Spalt abgegeben.",0],["Hier werden die Organellen des Neurons gebildet.",0]],
  e:"Am Axonhügel werden die Potentialänderungen aus Dendriten und Soma summiert. Wird das Schwellenpotential überschritten, entsteht ein Aktionspotential. Neurotransmitter werden an den Endknöpfchen freigesetzt, Organellen im Soma gebildet."},
 {t:"Aufbau des Neurons", multi:false, q:"Was ist die Hauptaufgabe der Myelinscheide?",
  o:[["Sie isoliert das Axon und beschleunigt die Leitung.",1],["Sie pumpt aktiv Na⁺-Ionen aus dem Axon ins Außenmedium.",0],["Sie speichert Neurotransmitter für die Freisetzung.",0],["Sie nimmt Signale auf und leitet sie zum Soma.",0]],
  e:"Die Myelinscheide isoliert das Axon. Dadurch springt die Erregung von Schnürring zu Schnürring (saltatorische Erregungsleitung), was deutlich schneller ist."},
 {t:"Aufbau des Neurons", multi:true, q:"Welche Aussagen zu den Ranvier'schen Schnürringen sind richtig?",
  o:[["Es sind Lücken zwischen zwei Myelinabschnitten.",1],["Dort hat die Axonmembran Kontakt zum Außenmedium.",1],["Sie liegen ausschließlich an den Dendriten des Neurons.",0],["Dort ist das Axon besonders dick von Myelin umhüllt.",0]],
  e:"Zwischen den Myelinabschnitten liegen die Schnürringe. Nur dort liegt die Axonmembran frei, und dort entstehen bei der saltatorischen Leitung die Aktionspotentiale."},
 {t:"Aufbau des Neurons", multi:false, q:"Welche Aufgabe hat der Zellkörper (Soma) eines Neurons?",
  o:[["Er enthält den Zellkern und steuert den Zellstoffwechsel.",1],["Er leitet Aktionspotentiale über weite Strecken weiter.",0],["Er setzt Neurotransmitter in den synaptischen Spalt frei.",0],["Er isoliert das Axon durch mehrfaches Umwickeln.",0]],
  e:"Das Soma ist das Stoffwechsel- und Versorgungszentrum der Nervenzelle. Dort liegen Zellkern, ER und Mitochondrien."},
 {t:"Aufbau des Neurons", multi:true, q:"Welche Strukturen sind Bestandteile der Nervenzelle selbst?",
  o:[["Dendriten",1],["Zellkörper (Soma)",1],["Axon",1],["Schwann-Zellen der Myelinscheide",0]],
  e:"Dendriten, Soma und Axon gehören zum Neuron. Schwann-Zellen sind Gliazellen, die das Axon umhüllen, sie sind aber eigene Zellen."},
 {t:"Aufbau des Neurons", multi:false, q:"An welcher Stelle des Neurons werden Neurotransmitter freigesetzt?",
  o:[["An den synaptischen Endknöpfchen des Axons","1"],["An den verzweigten Dendriten des Neurons",0],["Am Axonhügel direkt hinter dem Soma",0],["An den Schnürringen der Myelinscheide",0]],
  e:"Die Endknöpfchen am Ende des Axons enthalten Vesikel mit Neurotransmittern. Diese werden in den synaptischen Spalt abgegeben."},
 {t:"Aufbau des Neurons", multi:false, q:"In welche Richtung läuft die Erregung in einem typischen Neuron?",
  o:[["Dendriten → Soma → Axon → Endknöpfchen",1],["Endknöpfchen → Axon → Soma → Dendriten",0],["Axon → Dendriten → Soma → Endknöpfchen",0],["Soma → Dendriten → Endknöpfchen → Axon",0]],
  e:"Die Information wird an den Dendriten aufgenommen, im Soma und am Axonhügel verrechnet, über das Axon weitergeleitet und an den Endknöpfchen weitergegeben."},

 {t:"Ionenverteilung", multi:true, q:"Welche Aussagen zur Ionenverteilung am ruhenden Neuron treffen zu?",
  o:[["K⁺ ist innen deutlich höher konzentriert als außen.",1],["Na⁺ ist außen deutlich höher konzentriert als innen.",1],["Na⁺ ist innen deutlich höher konzentriert als außen.",0],["Cl⁻ ist innen deutlich höher konzentriert als außen.",0]],
  e:"Im Zellinneren überwiegt K⁺, im Außenmedium überwiegen Na⁺ und Cl⁻."},
 {t:"Ionenverteilung", multi:false, q:"Wie sind die Cl⁻-Ionen im Ruhezustand grob verteilt?",
  o:[["Außen ist die Konzentration höher als innen.",1],["Innen ist die Konzentration höher als außen.",0],["Sie liegen ausschließlich im Zellinneren vor.",0],["Innen und außen ist die Konzentration identisch.",0]],
  e:"Zusammen mit Na⁺ liegt Cl⁻ vor allem im Außenmedium vor. Im Inneren überwiegen die organischen Anionen."},
 {t:"Ionenverteilung", multi:false, q:"Warum tragen organische Anionen (z. B. Proteine) zum negativen Zellinneren bei?",
  o:[["Sie können die Membran nicht passieren und bleiben innen.",1],["Sie werden von der Na⁺-K⁺-Pumpe nach innen gepumpt.",0],["Sie strömen ständig durch offene Kanäle hin und her.",0],["Sie entstehen ausschließlich im Außenmedium der Zelle.",0]],
  e:"Große organische Anionen passen nicht durch die Membrankanäle. Sie bleiben im Zellinneren und tragen dort einen Überschuss an negativer Ladung."},
 {t:"Ionenverteilung", multi:true, q:"Welche Aussagen zur Na⁺-K⁺-Pumpe sind richtig?",
  o:[["Sie transportiert Ionen entgegen dem Konzentrationsgefälle.",1],["Sie benötigt dafür ATP als Energiequelle.",1],["Sie befördert 3 Na⁺ nach außen und 2 K⁺ nach innen.",1],["Sie befördert 2 Na⁺ nach außen und 3 K⁺ nach innen.",0],["Sie arbeitet durch Diffusion ohne Energiebedarf.",0]],
  e:"Die Pumpe leistet aktiven Transport gegen das Konzentrationsgefälle und verbraucht dafür ATP. Pro Zyklus verlassen 3 Na⁺ die Zelle, 2 K⁺ gelangen hinein."},
 {t:"Ionenverteilung", multi:false, q:"Welchen Wert hat das Ruhepotential eines typischen Neurons ungefähr?",
  o:[["Etwa −70 mV, innen negativ gegenüber außen",1],["Etwa +70 mV, innen positiv gegenüber außen",0],["Etwa 0 mV, kein Ladungsunterschied vorhanden",0],["Etwa −700 mV, innen extrem negativ geladen",0]],
  e:"Das Ruhepotential liegt bei vielen Neuronen bei etwa −70 mV. Das Zellinnere ist also negativ gegenüber dem Außenmedium."},
 {t:"Ionenverteilung", multi:false, q:"Was ist die Hauptursache für das Ruhepotential?",
  o:[["K⁺ strömt durch offene Kanäle aus, Anionen bleiben zurück.",1],["Na⁺ strömt durch offene Kanäle massenhaft ins Zellinnere.",0],["Cl⁻ wird durch eine Pumpe aktiv nach außen befördert.",0],["Die Na⁺-K⁺-Pumpe erzeugt allein die ganze Ladungsdifferenz.",0]],
  e:"Die Ruhemembran ist vor allem für K⁺ durchlässig. K⁺ diffundiert nach außen, die nicht passierfähigen Anionen bleiben im Inneren, und es entsteht ein negatives Innenpotential."},
 {t:"Ionenverteilung", multi:true, q:"Warum strömt K⁺ nicht so lange nach außen, bis innen und außen gleich viel K⁺ vorliegt?",
  o:[["Das negative Innere zieht K⁺ elektrisch wieder zurück.",1],["Chemische und elektrische Kraft gleichen sich im Gleichgewicht aus.",1],["Die Kaliumkanäle schließen sich nach kurzer Zeit komplett.",0],["Außen ist kein Platz mehr für weitere K⁺-Ionen.",0]],
  e:"Dem chemischen Gradienten (nach außen) wirkt die elektrische Kraft (nach innen) entgegen. Im Gleichgewicht heben sich beide auf, und es fließt netto kein K⁺ mehr."},
 {t:"Ionenverteilung", multi:false, q:"Für welches Ion ist die Membran im Ruhezustand am durchlässigsten?",
  o:[["K⁺",1],["Na⁺",0],["Cl⁻",0],["Organische Anionen",0]],
  e:"Im Ruhezustand sind überwiegend K⁺-Kanäle offen. Die Membran ist deshalb für K⁺ deutlich durchlässiger als für Na⁺."},
 {t:"Ionenverteilung", multi:true, q:"Warum muss die Na⁺-K⁺-Pumpe auch im Ruhezustand ständig arbeiten?",
  o:[["Na⁺ sickert langsam durch Leckkanäle in die Zelle ein.",1],["K⁺ diffundiert ständig aus der Zelle und geht verloren.",1],["Die Pumpe erzeugt zusätzliche Na⁺-Ionen für die Zelle.",0],["Die Pumpe öffnet die Kaliumkanäle für den Ausstrom.",0]],
  e:"Na⁺ sickert ein, K⁺ strömt aus. Ohne die Pumpe würden sich die Konzentrationsunterschiede mit der Zeit angleichen."},
 {t:"Ionenverteilung", multi:false, q:"Was passiert langfristig, wenn die ATP-Produktion einer Nervenzelle ausfällt?",
  o:[["Die Gefälle gleichen sich an, das Ruhepotential schwindet.",1],["Das Ruhepotential wird dauerhaft noch stärker negativ als zuvor.",0],["Nichts, da Ionen die Membran niemals passieren können.",0],["Es entstehen vermehrt Aktionspotentiale ohne jeden Reiz.",0]],
  e:"Ohne ATP arbeitet die Pumpe nicht mehr. Die Ionen gleichen sich über Leckströme an, das Membranpotential nähert sich 0 mV, und die Zelle ist nicht mehr erregbar."},
 {t:"Ionenverteilung", multi:false, q:"Woraus setzt sich der elektrochemische Gradient eines Ions zusammen?",
  o:[["Aus Konzentrationsgefälle und Ladungsunterschied der Membran",1],["Nur aus dem Konzentrationsgefälle zwischen Zelle und Außenmedium",0],["Nur aus dem Ladungsunterschied zwischen innen und außen",0],["Aus Temperatur und Druck in Zelle und Außenmedium",0]],
  e:"Auf geladene Teilchen wirken zwei Kräfte: die Diffusion entlang des Konzentrationsgefälles und die elektrische Anziehung bzw. Abstoßung durch das Membranpotential."},
 {t:"Ionenverteilung", multi:true, q:"Welche Vorgänge sind passiver Transport?",
  o:[["K⁺-Ausstrom durch offene Kaliumkanäle",1],["Na⁺-Einstrom durch Leckkanäle",1],["Na⁺-Transport nach außen durch die Pumpe",0],["K⁺-Transport nach innen durch die Pumpe",0]],
  e:"Passiver Transport läuft entlang des Gradienten ohne Energieaufwand ab (Ionenkanäle). Die Pumpe transportiert dagegen aktiv unter ATP-Verbrauch."}
];
Q.forEach(x=>x.o.forEach(o=>o[1]=+o[1]));

// ===== Aufbau =====
const quiz = document.getElementById('quiz');
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const items = Q.map(x => ({...x, opts: shuffle(x.o.map(([txt,ok])=>({txt, ok:!!ok})))}));
items.forEach((it,n)=>{
  const d = document.createElement('div'); d.className='card'; d.id='c'+n;
  const type = it.multi ? 'checkbox' : 'radio';
  d.innerHTML = `<div class="topic">${it.t} · Frage ${n+1}</div><div class="q">${it.q}</div>` +
    `<div class="hint">${it.multi ? '<b>Mehrere Antworten</b> können richtig sein' : '<b>Eine Antwort</b> ist richtig'}</div>` +
    it.opts.map((o,i)=>`<label class="opt"><input type="${type}" name="q${n}" value="${i}"><span>${o.txt}</span></label>`).join('') +
    `<div class="verdict"></div><div class="exp"><b>Erklärung:</b> ${it.e}</div>`;
  quiz.appendChild(d);
});
const btn = document.getElementById('check');
const checkedIn = n => [...document.querySelectorAll(`input[name=q${n}]:checked`)].map(e=>+e.value);
quiz.addEventListener('change', ()=>{
  const n = items.filter((_,i)=>checkedIn(i).length>0).length;
  document.getElementById('prog').textContent = `${n} von ${items.length} beantwortet`;
  btn.disabled = n < items.length;
});

btn.addEventListener('click', ()=>{
  btn.disabled = true;
  let pts = 0; const topics = {}; const res = [];
  items.forEach((it,n)=>{
    const sel = checkedIn(n);
    const card = document.getElementById('c'+n);
    const labels = card.querySelectorAll('label.opt');
    const ok = it.opts.every((o,i)=> o.ok === sel.includes(i));
    if(ok) pts++;
    topics[it.t] = topics[it.t] || {p:0,m:0}; topics[it.t].m++; if(ok) topics[it.t].p++;
    labels.forEach((l,i)=>{ l.querySelector('input').disabled = true;
      const o = it.opts[i], picked = sel.includes(i);
      if(o.ok && picked) l.classList.add('ok');
      else if(o.ok && !picked) l.classList.add('miss');
      else if(!o.ok && picked) l.classList.add('bad'); });
    const v = card.querySelector('.verdict');
    v.textContent = ok ? '✔ Richtig' : (it.multi ? '✘ Nicht ganz: gestrichelt umrandet sind richtige Antworten, die du nicht angekreuzt hast.' : '✘ Leider falsch');
    v.style.color = ok ? '#2e7d32' : '#c62828';
    card.classList.add('show');
    res.push(ok?1:0);
  });
  const pct = Math.round(pts/items.length*100);
  const r = document.getElementById('result'); r.style.display='block';
  r.innerHTML = `<h2 style="margin-top:0;color:#1f4e79">Ergebnis: ${pts} von ${items.length} Punkten (${pct} %)</h2>` +
    Object.entries(topics).map(([k,v])=>{const p=Math.round(v.p/v.m*100);
      return `<div><b>${k}</b>: ${v.p} von ${v.m}</div><div class="bar"><div style="width:${p}%"></div></div>`;}).join('') +
    `<p class="small">Tipp: Schau dir bei den nicht richtig beantworteten Fragen die Erklärung an und wiederhole das entsprechende Thema.</p>
     <p class="small" id="sent">Ergebnis wird anonym an die Lehrkraft übermittelt …</p>`;
  r.scrollIntoView({behavior:'smooth'});

  const payload = {
    test: TEST_NAME,
    klasse: document.getElementById('klasse').value.trim() || "unbekannt",
    datum: new Date().toISOString(),
    punkte: pts, max: items.length,
    themen: topics,
    fragen: items.map((it,i)=>({nr:i+1, thema:it.t, richtig:res[i]}))
  };
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>{document.getElementById('sent').textContent='Dein Ergebnis wurde anonym übermittelt.';})
    .catch(()=>{document.getElementById('sent').textContent='Übermittlung nicht möglich (offline?). Dein Ergebnis oben gilt trotzdem.';});
});
</script>
</body>
</html>
